name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  release:
    types: [published]

jobs:
  install-and-test:
    name: Install Dependencies & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build:
    name: Build Application
    needs: install-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build application package
        run: |
          echo "Packaging application..."
          zip -r app-build.zip app.py requirements.txt
          echo "Build artifact created: app-build.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-app-build
          path: app-build.zip

  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy app files to EC2 (staging)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ec2-user
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "app.py,requirements.txt"
          target: "/home/ec2-user/flask-app"

      - name: Install dependencies and (re)start app on EC2 (staging)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ec2-user
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /home/ec2-user/flask-app
            sudo dnf install -y python3-pip >/dev/null 2>&1 || true
            python3 -m venv venv
            source venv/bin/activate
            python3 -m pip install --upgrade pip
            pip install -r requirements.txt
            pkill -f "python3 app.py" || true
            nohup python3 app.py > app.log 2>&1 &
            sleep 5
            curl -f http://localhost:5000/health
            echo "Staging deployment complete."

  deploy-production:
    name: Deploy to Production
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy app files to EC2 (production)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ec2-user
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "app.py,requirements.txt"
          target: "/home/ec2-user/flask-app"

      - name: Install dependencies and (re)start app on EC2 (production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ec2-user
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /home/ec2-user/flask-app
            sudo dnf install -y python3-pip >/dev/null 2>&1 || true
            python3 -m venv venv
            source venv/bin/activate
            python3 -m pip install --upgrade pip
            pip install -r requirements.txt
            pkill -f "python3 app.py" || true
            nohup python3 app.py > app.log 2>&1 &
            sleep 5
            curl -f http://localhost:5000/health
            echo "Production deployment complete."