name: Flask CI/CD Pipeline New

on:
  push:
    branches:
      - main
      - staging

  release:
    types:
      - published

jobs:
  install-and-test:
    name: Install Dependencies & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest -v

  build:
    name: Build Application
    needs: install-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Build Artifact
        run: |
          zip -r app-build.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x "venv/*"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-app-build
          path: app-build.zip

  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ec2-user
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/flask-app"
          strip_components: 0
          overwrite: true

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ec2-user
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/flask-app

            sudo dnf install -y python3 python3-pip >/dev/null 2>&1 || true

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate

            python -m pip install --upgrade pip
            pip install -r requirements.txt

            # Stop the previous run using the PID file we wrote last time.
            # This never matches on command text, so it can't accidentally
            # target the currently-running deploy script itself.
            if [ -f flask.pid ] && kill -0 "$(cat flask.pid)" 2>/dev/null; then
              echo "Stopping existing application (PID $(cat flask.pid))..."
              kill -15 "$(cat flask.pid)"
              sleep 3
            else
              echo "No existing tracked application process found."
            fi

            echo "Starting Flask application..."
            setsid nohup python3 app.py < /dev/null > app.log 2>&1 &
            echo $! > flask.pid
            disown

            sleep 8

            echo "Running Processes"
            ps -ef | grep app.py || true

            echo "Application Log"
            cat app.log || true

            echo "Health Check"
            curl --retry 5 \
                 --retry-delay 2 \
                 --retry-connrefused \
                 -f http://localhost:5000/health

            echo "Staging deployment completed successfully."

  deploy-production:
    name: Deploy to Production
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ec2-user
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/flask-app"
          strip_components: 0
          overwrite: true

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ec2-user
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/flask-app

            sudo dnf install -y python3 python3-pip >/dev/null 2>&1 || true

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate

            python -m pip install --upgrade pip
            pip install -r requirements.txt

            if [ -f flask.pid ] && kill -0 "$(cat flask.pid)" 2>/dev/null; then
              echo "Stopping existing application (PID $(cat flask.pid))..."
              kill -15 "$(cat flask.pid)"
              sleep 3
            else
              echo "No existing tracked application process found."
            fi

            echo "Starting Flask application..."
            setsid nohup python3 app.py < /dev/null > app.log 2>&1 &
            echo $! > flask.pid
            disown

            sleep 8

            echo "Running Processes"
            ps -ef | grep app.py || true

            echo "Application Log"
            cat app.log || true

            echo "Health Check"
            curl --retry 5 \
                 --retry-delay 2 \
                 --retry-connrefused \
                 -f http://localhost:5000/health

            echo "Production deployment completed successfully."